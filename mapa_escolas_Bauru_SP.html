<div id="layer-search-container">
  <input type="text" id="layer-search" placeholder="Buscar escolas..." title="Buscar escola pelo nome">
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var input = document.getElementById('layer-search');
    var hasOpened = false;

    function aplicarFiltro() {
      var termo = input.value.toLowerCase();
      var labels = document.querySelectorAll('.leaflet-control-layers-list label');
      labels.forEach(function (label) {
        var text = label.textContent.toLowerCase();
        label.style.display = text.includes(termo) ? "" : "none";
      });

      // Expande o menu se ainda não foi aberto
      if (termo.length > 0 && !hasOpened) {
        var toggle = document.querySelector('.leaflet-control-layers-toggle');
        if (toggle) {
          toggle.click();
          hasOpened = true;
        }
      }
    }

    // Observer para aguardar o botão aparecer
    const observer = new MutationObserver(() => {
      const toggle = document.querySelector('.leaflet-control-layers-toggle');
      if (toggle && input) {
        input.addEventListener('input', aplicarFiltro);
        observer.disconnect();  // para de observar após encontrar
      }
    });

    // Começa a observar mudanças no body
    observer.observe(document.body, { childList: true, subtree: true });
  });
</script>

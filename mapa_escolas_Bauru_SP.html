<div id="layer-search-container">
  <input type="text" id="layer-search" placeholder="Buscar escolas..." title="Buscar escola pelo nome">
</div>

<script>
(function() {
  let input = null;
  let hasOpened = false;

  function aplicarFiltro() {
    if (!input) return;
    const termo = input.value.toLowerCase();
    const labels = document.querySelectorAll('.leaflet-control-layers-list label');
    labels.forEach(label => {
      const text = label.textContent.toLowerCase();
      label.style.display = text.includes(termo) ? "" : "none";
    });

    if (termo.length > 0 && !hasOpened) {
      const toggle = document.querySelector('.leaflet-control-layers-toggle');
      if (toggle) {
        toggle.click();
        hasOpened = true;
      }
    }
  }

  const observer = new MutationObserver(() => {
    const toggle = document.querySelector('.leaflet-control-layers-toggle');
    input = document.getElementById('layer-search');
    if (toggle && input) {
      input.addEventListener('input', aplicarFiltro);
      observer.disconnect(); // parar de observar após configurar
    }
  });

  observer.observe(document.body, { childList: true, subtree: true });
})();
</script>
